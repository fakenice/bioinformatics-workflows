<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="0" y="0" width="32" height="32" rx="6" ry="6" fill="url(#bg)"/>
  <!-- Stylized flow symbol: three interconnected nodes with flowing arrows -->
  <!-- Node 1: top-left -->
  <circle cx="8" cy="10" r="2.5" fill="url(#flow)"/>
  <!-- Node 2: center-right (slightly offset) -->
  <circle cx="23" cy="16" r="2.5" fill="url(#flow)"/>
  <!-- Node 3: bottom-left -->
  <circle cx="8" cy="22" r="2.5" fill="url(#flow)"/>
  <!-- Flowing connections between nodes -->
  <!-- Top-left to center-right -->
  <path d="M10.5 10 Q17 8 20.5 14.5" stroke="url(#flow)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Center-right to bottom-left -->
  <path d="M20.5 17.5 Q17 24 10.5 22" stroke="url(#flow)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Small accent dot -->
  <circle cx="15" cy="14" r="1" fill="#c4b5fd" opacity="0.6"/>
</svg>